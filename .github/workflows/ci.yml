# Runs on every push and pull request. No licensed data is needed: the frontend tests use generated fixtures,
# and the backend tests that need backend/data skip themselves when it is missing.
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the hosted-demo variant (Harness hidden)
        run: npm run build
        env:
          NEXT_PUBLIC_HIDE_HARNESS: "true"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group harness
      - run: uv run pytest -q
