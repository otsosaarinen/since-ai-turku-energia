# Central config. All periods are UTC. Seeds fixed for reproducibility.
seed: 42
paths:
  inputs: data/inputs.parquet
  spot: data/spot_nordpool.csv            # Nord Pool licence: hackathon use only, never commit
  actuals_validation: data/actuals_validation.csv
  origins_test: starter_package_v1/forecast_origins.csv
  sample_submission: starter_package_v1/sample_submission.csv
  outputs: outputs
horizon_steps: 40
spike_margin: 50.0
lookback_quarters: 700          # history window per origin (> 7 days)
periods:
  # first usable-label cut-off == first origin of the period being predicted
  validation_first_origin: "2026-09-06T21:00:00Z"
  validation_last_origin: "2026-10-04T20:00:00Z"
  test_first_origin: "2026-10-04T21:00:00Z"
  training_cutoff_label_origin: "2026-10-04T21:00:00Z"
model:
  target: spread                  # "spread" = imbalance - spot(target), "level" = imbalance
  rounds_max: 600
  early_stopping: 40
  inner_valid_days: 14
  n_seeds: 6
  calibrate_interval: true
  calib_cap: 40.0
  lgbm:
    learning_rate: 0.04
    num_leaves: 8
    min_data_in_leaf: 200
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 5.0
    num_threads: 8
    extra_trees: true            # chosen on 8 rolling windows (scripts/run_rolling.py)
    verbose: -1
