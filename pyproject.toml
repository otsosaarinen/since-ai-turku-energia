[project]
name = "imbalance-forecast"
version = "0.1.0"
description = "Since AI 2026 - Turku Energia: 10 h ahead Finnish imbalance price forecast"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=14",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]
app = ["streamlit>=1.40"]
harness = ["openai>=1.50", "scipy>=1.11", "statsmodels>=0.14"]   # for the separate harness repo in ~/Projects/livelectroray

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
